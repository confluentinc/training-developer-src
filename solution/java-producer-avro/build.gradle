plugins {
  id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
  id 'java'
  id 'application'
}

application {
    mainClass = 'clients.Producer'
}

repositories {
    mavenCentral()
    maven { url "https://packages.confluent.io/maven/" }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation group: 'org.apache.kafka', name: 'kafka-clients', version: '3.9.0'
    implementation group: 'io.confluent', name: 'monitoring-interceptors', version: '8.1.1'

    implementation group: 'org.apache.avro', name: 'avro', version: '1.12.0'
    implementation group: 'io.confluent', name: 'kafka-avro-serializer', version: '8.1.1'

    implementation group: 'org.slf4j', name: 'slf4j-reload4j', version: '2.0.16'
}
